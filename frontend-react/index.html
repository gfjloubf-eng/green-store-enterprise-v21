<html lang="ar" dir="rtl">

<link rel="icon" type="image/png" sizes="192x192" href="/qutoof-app-icon-192.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:description" content="الطبيعة أقرب إليك" />

    <meta property="og:site_name" content="قطوف الطبيعة" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="قطوف الطبيعة" />
    <meta name="twitter:description" content="الطبيعة أقرب إليك" />
    <meta name="twitter:image" content="/qutoof-official.png" />
    <title>قطوف الطبيعة — الطبيعة أقرب إليك</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Theme flash prevention — applies stored theme before React hydrates -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('gsd-theme');
          var finalTheme = (theme === 'light' || theme === 'dark') ? theme : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'light');
          document.documentElement.setAttribute('data-theme', finalTheme);
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(finalTheme);
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="boot-splash" role="status" aria-live="polite" aria-label="جارٍ فتح قطوف الطبيعة">
      <div class="boot-splash__glow boot-splash__glow--green" aria-hidden="true"></div>
      <div class="boot-splash__glow boot-splash__glow--orange" aria-hidden="true"></div>
      <div class="boot-splash__content">
        <img src="/qutoof-official.png" width="256" height="171" alt="قطوف الطبيعة — الطبيعة أقرب إليك" fetchpriority="high" decoding="async" />
        <p>الطبيعة أقرب إليك</p>
        <span aria-hidden="true"><i></i></span>
      </div>
    </div>
    <style>
      #boot-splash{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;overflow:hidden;background:linear-gradient(rgba(248,251,245,.88),rgba(248,251,245,.96)),url('/qutoof-vegetables-mobile-background.webp') center/cover no-repeat;color:#1e5424;transition:opacity .35s ease-in-out,visibility .35s ease-in-out}
      #boot-splash.boot-splash--hide{opacity:0;visibility:hidden;pointer-events:none}
      .boot-splash__content{position:relative;z-index:1;display:grid;justify-items:center;width:min(85vw,400px);text-align:center;animation:boot-fade-in 0.6s ease-out}
      .boot-splash__content img{display:block;width:min(72vw,280px);height:auto;object-fit:contain;filter:drop-shadow(0 20px 40px rgba(30,84,36,.18))}
      .boot-splash__content p{margin:12px 0 24px;font:700 18px/1.6 Cairo,system-ui,sans-serif;letter-spacing:.02em;color:#1e5424;text-shadow: 0 2px 4px rgba(255,255,255,0.5)}
      .boot-splash__content span{display:block;width:120px;height:6px;overflow:hidden;border-radius:999px;background:rgba(30,84,36,.1)}
      .boot-splash__content i{display:block;width:40%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#f39a16,#1e8b3b);animation:boot-progress 1.2s cubic-bezier(0.65, 0, 0.35, 1) infinite}
      @keyframes boot-fade-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
      .boot-splash__glow{position:absolute;border-radius:50%;filter:blur(28px);opacity:.28;pointer-events:none}
      .boot-splash__glow--green{width:42vw;height:42vw;top:-15vw;right:-12vw;background:#8bcf3f}
      .boot-splash__glow--orange{width:38vw;height:38vw;bottom:-16vw;left:-12vw;background:#f6aa35}
      @keyframes boot-progress{0%{transform:translateX(0)}100%{transform:translateX(265%)} }
      @media(prefers-reduced-motion:reduce){#boot-splash{transition:none}.boot-splash__content i{animation:none;margin-left:31%}}
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
